[package]
name = "venir-reporter-bridge"
version = "0.0.0"
edition = "2021"
publish = false

# A place to compile and test Venir's `src/stub_structs.rs` without `rust_verify`.
#
# Venir links against rustc internals through `rust_verify`, so it can only be
# built with the pinned x86_64-linux toolchain in its rust-toolchain.toml. Its
# reporter -- the half that turns verifier messages into the JSON lines Verno
# reads, including the counterexample model -- needs none of that: it needs `air`
# and `vir` only. Venir's `tests/run-mutations.py --bridge <this dir>`
# transplants the file here (eliding the three-empty-method
# `rust_verify::verifier::Diagnostics` impl) and runs its checks.
#
# src/lib.rs is a placeholder; the script overwrites it.

[dependencies]
vir = { path = "../vir" }
air = { path = "../air" }
serde = { version = "1.0.136", features = ["derive"] }
serde_json = "1.0"
regex = "^1.0"
